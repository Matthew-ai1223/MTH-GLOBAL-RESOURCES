<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile | MTH GLOBAL RESOURCES</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap"
    rel="stylesheet">

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <!-- Styles -->
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <style>
    /* Hero Banner — matches dashboard welcome banner */
    .profile-banner {
      background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%);
      color: white;
      padding: 3rem 2rem;
      border-radius: 1rem;
      margin-bottom: 2.5rem;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 25px -5px rgba(30, 58, 138, 0.4);
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 2rem;
      min-height: 180px;
    }

    .profile-banner::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: url('data:image/svg+xml;utf8,<svg width="20" height="20" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><circle cx="2" cy="2" r="1.5" fill="rgba(255,255,255,0.05)"/></svg>') repeat;
      z-index: 1;
    }

    .profile-banner::after {
      content: '\f2bd'; /* user-circle icon */
      font-family: 'Font Awesome 6 Free';
      font-weight: 900;
      position: absolute;
      right: -5%;
      top: 50%;
      transform: translateY(-50%) rotate(-10deg);
      font-size: 14rem;
      color: rgba(255, 255, 255, 0.05);
      z-index: 1;
      pointer-events: none;
    }

    .profile-avatar {
      width: 90px;
      height: 90px;
      background: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      color: var(--primary);
      box-shadow: var(--shadow-lg);
      border: 4px solid rgba(255, 255, 255, 0.25);
      z-index: 2;
      flex-shrink: 0;
      font-weight: 700;
    }

    .profile-banner-content {
      position: relative;
      z-index: 2;
      flex-grow: 1;
    }

    .profile-banner h1 {
      color: white;
      margin: 0 0 0.35rem 0;
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      text-shadow: 0 2px 4px rgba(0,0,0,0.2);
    }

    .profile-banner p {
      opacity: 0.9;
      font-size: 1.1rem;
      margin: 0;
      line-height: 1.5;
    }

    .settings-grid {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 2rem;
      align-items: start;
    }

    .sidebar-card {
      padding: 0.75rem 0;
      overflow: hidden;
    }

    .sidebar-nav {
      display: flex;
      flex-direction: column;
    }

    .sidebar-nav-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.875rem 1.5rem;
      text-decoration: none;
      color: var(--text-main);
      font-weight: 500;
      transition: all 0.2s ease;
      border-left: 4px solid transparent;
    }

    .sidebar-nav-item i {
      color: var(--text-muted);
      width: 20px;
      text-align: center;
      font-size: 1.1rem;
      transition: color 0.2s ease;
    }

    .sidebar-nav-item:hover {
      background: var(--bg-alt);
      color: var(--primary);
    }

    .sidebar-nav-item:hover i {
      color: var(--primary);
    }

    .sidebar-nav-item.active {
      background: rgba(30, 58, 138, 0.05);
      color: var(--primary);
      border-left-color: var(--primary);
      font-weight: 700;
    }

    .sidebar-nav-item.active i {
      color: var(--primary);
    }

    .form-section-title {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--primary-dark);
      margin: 0 0 1.5rem 0;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: var(--text-main);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 0.875rem 1rem;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      color: var(--text-main);
      transition: all 0.2s ease;
      background: var(--bg-card);
    }

    .form-group input:focus,
    .form-group textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(30, 58, 138, 0.1);
      outline: none;
    }

    .form-group input:disabled {
      background: var(--bg-alt);
      color: var(--text-muted);
      cursor: not-allowed;
      border-color: var(--border-color);
    }

    .btn-save {
      background: var(--primary);
      color: white;
      padding: 0.875rem 2rem;
      border: none;
      border-radius: var(--radius-md);
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }

    .btn-save:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .btn-save:disabled {
      background: var(--text-muted);
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    @media (max-width: 992px) {
      .settings-grid {
        grid-template-columns: 1fr;
        gap: 1.5rem;
      }
    }

    @media (max-width: 768px) {
      .profile-banner {
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 1.25rem;
        padding: 2.5rem 1.5rem;
        min-height: 140px;
        margin-bottom: 1.5rem;
      }

      .profile-banner h1 {
        font-size: 1.75rem;
      }

      .profile-banner p {
        font-size: 0.95rem;
      }

      .btn-save {
        width: 100%;
      }
    }

    @media (max-width: 576px) {
      .profile-banner::after {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div id="layout"></div>

  <main class="container">
    <!-- Profile Banner -->
    <div class="profile-banner">
      <div class="profile-avatar" id="avatar-initial">U</div>
      <div class="profile-banner-content">
        <h1 id="header-name">Loading...</h1>
        <p id="header-email">Please wait while we fetch your profile</p>
      </div>
    </div>

    <div class="settings-grid">
      <!-- Sidebar Navigation -->
      <aside class="card sidebar-card">
        <nav class="sidebar-nav">
          <a href="#" class="sidebar-nav-item active">
            <i class="fa-solid fa-user-circle"></i> Personal Information
          </a>
          <a href="./orders.html" class="sidebar-nav-item">
            <i class="fa-solid fa-box"></i> My Orders
          </a>
          <a href="./wishlist.html" class="sidebar-nav-item">
            <i class="fa-solid fa-heart"></i> My Wishlist
          </a>
          <a href="javascript:logout()" class="sidebar-nav-item" style="color: #ef4444;">
            <i class="fa-solid fa-right-from-bracket" style="color: #ef4444;"></i> Logout
          </a>
        </nav>
      </aside>

      <!-- Profile Form -->
      <section class="card">
        <h2 class="form-section-title">
          <i class="fa-solid fa-user-gear"></i> Update Your Information
        </h2>
        <form id="profile-form">
          <div class="grid grid-2">
            <div class="form-group">
              <label>Full Name</label>
              <input type="text" name="name" id="f-name" placeholder="Enter your full name" required>
            </div>
            <div class="form-group">
              <label>Phone Number</label>
              <input type="tel" name="phone" id="f-phone" placeholder="e.g. +234 123 4567">
            </div>
          </div>
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="f-email" disabled title="Email cannot be changed">
          </div>
          <div class="form-group">
            <label>Delivery Address</label>
            <textarea name="address" id="f-address" rows="3" placeholder="Where should we send your orders?"></textarea>
          </div>
          <button type="submit" class="btn-save" id="save-btn">
            <i class="fa-solid fa-save"></i> Save Changes
          </button>
        </form>
      </section>
    </div>
  </main>

  <script src="../../assets/js/api-client.js"></script>
  <script src="../../assets/js/layout.js"></script>
  <script src="../../assets/js/pages/common.js"></script>
  <script>
    mountLayout();

    const form = document.getElementById('profile-form');
    const saveBtn = document.getElementById('save-btn');

    async function loadProfile() {
      const me = await authRequired();
      if (!me) return;

      document.getElementById('header-name').textContent = me.name || 'Anonymous';
      document.getElementById('header-email').textContent = me.email;
      document.getElementById('avatar-initial').textContent = (me.name || 'U').charAt(0).toUpperCase();

      document.getElementById('f-name').value = me.name || '';
      document.getElementById('f-phone').value = me.phone || '';
      document.getElementById('f-email').value = me.email || '';
      document.getElementById('f-address').value = me.address || '';
    }

    form.onsubmit = async (e) => {
      e.preventDefault();
      saveBtn.disabled = true;
      saveBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Saving...';

      try {
        const formData = new FormData(form);
        const data = Object.fromEntries(formData.entries());

        await api("profile.update", "POST", data);

        // Refresh local UI
        if (data.name) {
          document.getElementById('header-name').textContent = data.name;
          document.getElementById('avatar-initial').textContent = data.name.charAt(0).toUpperCase();
        }

        toast("Your profile has been updated successfully!", "success");
      } catch (err) {
        toast("Error updating profile: " + err.message);
      } finally {
        saveBtn.disabled = false;
        saveBtn.innerHTML = '<i class="fa-solid fa-save"></i> Save Changes';
      }
    };

    loadProfile();
  </script>
</body>

</html>
