<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | MTH GLOBAL RESOURCES</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <style>
    body {
      background: linear-gradient(135deg, #f0f9ff 0%, #f8fafc 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .auth-container {
      max-width: 450px;
      width: 100%;
      margin: auto;
      padding: 2rem 1rem;
    }
    .auth-card {
      background: var(--bg-card);
      padding: 2.5rem;
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-xl);
      border: 1px solid var(--border-color);
    }
    .auth-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .auth-header .brand {
      justify-content: center;
      margin-bottom: 1rem;
      font-size: 2rem;
    }
    .auth-header h1 {
      font-size: 1.75rem;
      color: var(--primary-dark);
      margin-bottom: 0.5rem;
      font-family: 'Playfair Display', serif;
    }
    .auth-header p {
      color: var(--text-muted);
    }
    .form-group {
      margin-bottom: 1.25rem;
    }
    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
      font-size: 0.875rem;
    }
    .input-wrapper {
      position: relative;
    }
    .input-wrapper i {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }
    .input-wrapper input {
      width: 100%;
      padding-left: 2.75rem;
    }
    .auth-footer {
      margin-top: 2rem;
      text-align: center;
      font-size: 0.9rem;
      color: var(--text-muted);
    }
    .auth-footer a {
      color: var(--primary);
      font-weight: 600;
    }
    .auth-footer a:hover {
      text-decoration: underline;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div id="layout"></div>
  <main class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <a href="../index.html" class="brand">
          <i class="fa-solid fa-droplet"></i> MTH GLOBAL RESOURCES
        </a>
        <h1 id="formTitle">Reset Password</h1>
        <p id="formDesc">Enter your email to receive a reset link</p>
      </div>

      <!-- Request Form -->
      <form id="requestForm">
        <div class="form-group">
          <label for="email">Email Address</label>
          <div class="input-wrapper">
            <i class="fa-regular fa-envelope"></i>
            <input name="email" id="email" type="email" placeholder="name@example.com" required>
          </div>
        </div>
        <button type="submit" style="width: 100%; margin-top: 0.5rem;">
          Send Reset Link <i class="fa-regular fa-paper-plane"></i>
        </button>
      </form>

      <!-- Confirm Form (Hidden initially) -->
      <form id="confirmForm" class="hidden">
        <input type="hidden" name="token" id="tokenField">
        <div class="form-group">
          <label for="password">New Password</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-lock"></i>
            <input name="password" id="password" type="password" placeholder="Enter new password" required minlength="8">
          </div>
        </div>
        <button type="submit" style="width: 100%; margin-top: 0.5rem;">
          Update Password <i class="fa-solid fa-check"></i>
        </button>
      </form>

      <div class="auth-footer">
        <p>Remembered your password? <a href="./login.html">Sign In</a></p>
      </div>
    </div>
  </main>

  <script src="../assets/js/api-client.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script>
    mountLayout();

    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    const requestForm = document.getElementById('requestForm');
    const confirmForm = document.getElementById('confirmForm');
    const formTitle = document.getElementById('formTitle');
    const formDesc = document.getElementById('formDesc');
    const tokenField = document.getElementById('tokenField');

    if (token) {
      // User is clicking link from email
      requestForm.classList.add('hidden');
      confirmForm.classList.remove('hidden');
      tokenField.value = token;
      formTitle.innerText = "Set New Password";
      formDesc.innerText = "Please enter a strong new password below.";
    }

    requestForm.onsubmit = async (e) => {
      e.preventDefault();
      const btn = requestForm.querySelector('button');
      const originalText = btn.innerHTML;
      btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Sending...';
      btn.disabled = true;

      try {
        const data = Object.fromEntries(new FormData(e.target).entries());
        const res = await api("auth.reset.request", "POST", data);
        toast(res.message || "Request sent successfully.", "success");
        requestForm.innerHTML = `<div style="text-align:center; padding: 2rem 0; color: var(--primary);"><i class="fa-solid fa-envelope-circle-check" style="font-size: 3rem; margin-bottom: 1rem;"></i><br><strong style="color:var(--text-main);">Check your inbox!</strong><br><span style="font-size:0.9rem; color:var(--text-muted);">We've sent a password reset link to your email.</span></div>`;
      } catch (err) {
        toast(err.message || "Failed to send request", "error");
        btn.innerHTML = originalText;
        btn.disabled = false;
      }
    };

    confirmForm.onsubmit = async (e) => {
      e.preventDefault();
      const btn = confirmForm.querySelector('button');
      const originalText = btn.innerHTML;
      btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Updating...';
      btn.disabled = true;

      try {
        const data = Object.fromEntries(new FormData(e.target).entries());
        const res = await api("auth.reset.confirm", "POST", data);
        toast("Password updated successfully!", "success");
        setTimeout(() => {
          location.href = "./login.html";
        }, 1500);
      } catch (err) {
        toast(err.message || "Failed to reset password", "error");
        btn.innerHTML = originalText;
        btn.disabled = false;
      }
    };
  </script>
</body>
</html>
