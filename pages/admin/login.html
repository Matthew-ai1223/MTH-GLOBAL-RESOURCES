<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | MTH GLOBAL RESOURCES</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/components.css">

  <style>
    body {
      background: #0a0a0a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      color: white;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      padding: 2rem;
    }

    .login-card {
      background: #141414;
      padding: 3rem 2.5rem;
      border-radius: var(--radius-xl);
      border: 1px solid #222;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    .brand-icon {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.75rem;
      margin: 0 auto 1.5rem;
      box-shadow: 0 10px 20px rgba(14, 78, 126, 0.3);
    }

    .login-card h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.75rem;
      margin-bottom: 0.5rem;
      color: #fff;
    }

    .login-card p {
      color: #888;
      font-size: 0.9rem;
      margin-bottom: 2.5rem;
    }

    .form-group {
      text-align: left;
      margin-bottom: 1.5rem;
    }

    .form-group label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
      color: #666;
    }

    .form-group input {
      width: 100%;
      background: #1a1a1a;
      border: 1px solid #333;
      padding: 1rem;
      border-radius: var(--radius-md);
      color: white;
      transition: var(--transition);
    }

    .form-group input:focus {
      border-color: var(--primary);
      background: #1f1f1f;
      outline: none;
    }

    .btn-login {
      width: 100%;
      background: var(--primary);
      color: white;
      padding: 1rem;
      border-radius: var(--radius-md);
      border: none;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: var(--transition);
      margin-top: 1rem;
    }

    .btn-login:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
    }

    .back-to-site {
      display: inline-block;
      margin-top: 2rem;
      color: #555;
      text-decoration: none;
      font-size: 0.85rem;
      transition: var(--transition);
    }

    .back-to-site:hover {
      color: var(--primary);
    }
  </style>
</head>

<body>
  <div class="login-container">
    <div class="login-card">
      <div class="brand-icon">
        <i class="fa-solid fa-droplet"></i>
      </div>
      <h1>Admin Portal</h1>
      <p>Secure authentication for MTH GLOBAL RESOURCES managers.</p>

      <form id="adminLoginForm">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="username" placeholder="@admin2026" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn-login" id="loginBtn">
          Sign In to Dashboard
        </button>
      </form>

      <a href="../../index.html" class="back-to-site">
        <i class="fa-solid fa-arrow-left"></i> Back to main site
      </a>
    </div>
  </div>

  <script src="../../assets/js/api-client.js"></script>
  <script>
    const form = document.getElementById('adminLoginForm');
    const btn = document.getElementById('loginBtn');

    form.onsubmit = async (e) => {
      e.preventDefault();
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Authenticating...';

      const email = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      try {
        const res = await api("auth.login", "POST", { email, password });

        if (res.role !== 'admin') {
          throw new Error("Access denied. Admin privileges required.");
        }

        toast("Authentication successful! Welcome back.", "success");
        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 1000);

      } catch (err) {
        toast(err.message, "error");
        btn.disabled = false;
        btn.innerHTML = 'Sign In to Dashboard';
      }
    };
  </script>
</body>

</html>
