<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel | MTH GLOBAL RESOURCES</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  
  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  
  <!-- Styles -->
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <style>
    .admin-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }
    .kpi-card {
      background: var(--bg-card);
      padding: 1.5rem;
      border-radius: var(--radius-lg);
      border-left: 4px solid var(--primary);
      box-shadow: var(--shadow-sm);
    }
    .kpi-card h3 {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
      font-family: 'Inter', sans-serif;
    }
    .kpi-card .value {
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--primary-dark);
    }
    .admin-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 2rem;
    }
    .nav-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 1rem;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
      background: var(--bg-alt);
      border-radius: var(--radius-md);
      color: var(--text-main);
      font-weight: 600;
      font-size: 0.8rem;
      gap: 0.5rem;
      text-align: center;
    }
    .nav-item i {
      font-size: 1.5rem;
      color: var(--primary);
    }
    .nav-item:hover {
      background: var(--primary);
      color: white;
    }
    .nav-item:hover i {
      color: white;
    }
  </style>
</head>
<body>
  <div id="layout"></div>

  <main class="container">
    <header style="margin-bottom: 2.5rem; display: flex; justify-content: space-between; align-items: flex-end;">
      <div>
        <h1 class="page-title">Admin Dashboard</h1>
        <p style="color: var(--text-muted);">Overview of MTH GLOBAL RESOURCES operations and performance.</p>
      </div>
      <div class="actions">
        <button class="btn btn-primary btn-small">
          <i class="fa-solid fa-plus"></i> New Product
        </button>
      </div>
    </header>

    <div id="kpis" class="admin-stats">
      <div class="loading-state" style="grid-column: 1/-1; text-align: center; padding: 2rem;">
        <i class="fa-solid fa-circle-notch fa-spin"></i>
      </div>
    </div>

    <div class="admin-grid">
      <section class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
          <h2 style="font-size: 1.25rem; margin: 0;">Recent Orders</h2>
          <a href="./orders.html" style="font-size: 0.85rem; color: var(--primary); font-weight: 600; text-decoration: none;">View All</a>
        </div>
        <div class="table-responsive">
          <table id="recent-orders-table">
            <thead>
              <tr>
                <th>Order ID</th>
                <th>Customer</th>
                <th>Amount</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody>
              <tr><td colspan="4" style="text-align:center; padding:2rem; color:var(--text-muted);">Loading orders...</td></tr>
            </tbody>
          </table>
        </div>
      </section>

      <section class="card">
        <h2 style="font-size: 1.25rem; margin-bottom: 1.5rem;">System Health</h2>
        <div style="display: flex; flex-direction: column; gap: 1.25rem;">
          <div style="display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem;">
            <div style="display: flex; align-items: center; gap: 0.75rem;">
              <i class="fa-solid fa-server" style="color: #10b981;"></i>
              <span>API Gateway</span>
            </div>
            <span class="badge badge-success">Online</span>
          </div>
          <div style="display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem;">
            <div style="display: flex; align-items: center; gap: 0.75rem;">
              <i class="fa-solid fa-database" style="color: #3b82f6;"></i>
              <span>Primary DB</span>
            </div>
            <span class="badge badge-success">Healthy</span>
          </div>
          <div style="display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem;">
            <div style="display: flex; align-items: center; gap: 0.75rem;">
              <i class="fa-solid fa-triangle-exclamation" style="color: #f59e0b;"></i>
              <span>Stock Alerts</span>
            </div>
            <span class="badge badge-warning" id="low-stock-count">...</span>
          </div>
          <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 0.5rem 0;">
          <a href="./inventory.html" class="btn secondary btn-small" style="width: 100%; justify-content: center;">
            <i class="fa-solid fa-boxes-stacked"></i> Manage Inventory
          </a>
        </div>
      </section>
    </div>
  </main>

  <script src="../../assets/js/api-client.js"></script>
  <script src="../../assets/js/admin-layout.js"></script>
  <script>
    mountAdminLayout();
    
    async function loadDashboard() {
      try {
        const [stats, orders, inventory] = await Promise.all([
          api("reports.summary"),
          api("orders.all"),
          api("inventory.list")
        ]);

        // Render KPIs
        const kpiMap = {
          total_users: { label: 'Users', icon: 'fa-users', color: '#3b82f6' },
          total_products: { label: 'Products', icon: 'fa-bottle-water', color: '#06b6d4' },
          total_orders: { label: 'Orders', icon: 'fa-clipboard-list', color: '#f59e0b' },
          income_total: { label: 'Revenue', icon: 'fa-money-bill-wave', color: '#8b5cf6', isCurrency: true }
        };

        const kpiContainer = document.getElementById('kpis');
        kpiContainer.innerHTML = Object.entries(kpiMap).map(([key, cfg]) => {
          const val = stats[key] || 0;
          const displayVal = cfg.isCurrency ? '₦' + Number(val).toLocaleString() : val;
          return `
            <div class="kpi-card" style="border-left-color: ${cfg.color}">
              <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                <div>
                  <h3>${cfg.label}</h3>
                  <div class="value">${displayVal}</div>
                </div>
                <i class="fa-solid ${cfg.icon}" style="color: ${cfg.color}; opacity: 0.2; font-size: 1.5rem;"></i>
              </div>
            </div>
          `;
        }).join("");

        // Render Recent Orders
        const ordersTable = document.querySelector('#recent-orders-table tbody');
        const recentOrders = orders.slice(0, 5);
        if (recentOrders.length === 0) {
          ordersTable.innerHTML = '<tr><td colspan="4" style="text-align:center; padding:2rem;">No orders yet.</td></tr>';
        } else {
          ordersTable.innerHTML = recentOrders.map(o => `
            <tr>
              <td>#${o.id}</td>
              <td>${o.customer_name || 'Guest'}</td>
              <td>₦${Number(o.total_amount).toLocaleString()}</td>
              <td><span class="badge status-${o.status.toLowerCase().replace(' ', '-')}">${o.status}</span></td>
            </tr>
          `).join("");
        }

        // Low stock count
        const lowStock = inventory.filter(i => parseFloat(i.quantity) <= parseFloat(i.reorder_level)).length;
        document.getElementById('low-stock-count').textContent = lowStock + ' Low';

      } catch (err) {
        console.error("Dashboard error:", err);
      }
    }

    loadDashboard();
  </script>
</body>
</html>
