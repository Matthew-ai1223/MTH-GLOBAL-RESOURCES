<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Livestock | MTH GLOBAL RESOURCES Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <style>
    .header-banner { background: linear-gradient(135deg,var(--bg-card),var(--bg-alt)); padding:2.5rem 2rem; border-radius:var(--radius-lg); margin-bottom:2rem; border:1px solid var(--border-color); display:flex; align-items:center; gap:1.5rem; }
    .header-icon { background:rgba(30,58,138,0.1); color:#1e3a8a; width:60px; height:60px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1.5rem; }
    .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:1000; align-items:center; justify-content:center; }
    .modal-overlay.open { display:flex; }
    .modal { background:var(--bg-card); border-radius:var(--radius-lg); padding:2rem; width:90%; max-width:480px; box-shadow:var(--shadow-lg); }
    .form-group { margin-bottom:1rem; }
    .form-group label { display:block; font-size:.875rem; font-weight:600; margin-bottom:.4rem; }
    .form-group input, .form-group select, .form-group textarea { width:100%; padding:.7rem 1rem; border:1px solid var(--border-color); border-radius:var(--radius-md); font-family:'Inter',sans-serif; }
    .form-row { display:grid; grid-template-columns:1fr 1fr; gap:1rem; }
  </style>
</head>
<body>
  <div id="layout"></div>
  <main class="container">
    <div class="header-banner">
      <div class="header-icon"><i class="fa-solid fa-cow"></i></div>
      <div>
        <h1 style="margin:0;font-family:'Playfair Display',serif;">Livestock Records</h1>
        <p style="margin:.5rem 0 0;color:var(--text-muted);">Track all farm animals and their health status.</p>
      </div>
    </div>
    <section class="card">
      <div class="toolbar" style="justify-content:space-between;margin-bottom:1.5rem;">
        <h2 style="font-size:1.25rem;margin:0;">All Livestock</h2>
        <button class="btn btn-primary btn-small" onclick="openModal()"><i class="fa-solid fa-plus"></i> Add Record</button>
      </div>
      <div id="livestock-container">
        <div style="text-align:center;padding:4rem;"><i class="fa-solid fa-circle-notch fa-spin" style="font-size:2rem;color:var(--primary);"></i></div>
      </div>
    </section>
  </main>

  <div class="modal-overlay" id="modal">
    <div class="modal">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;">
        <h3 style="margin:0;">Add Livestock Record</h3>
        <button onclick="closeModal()" style="background:none;border:none;font-size:1.25rem;cursor:pointer;"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Animal Type</label><input type="text" id="f-type" placeholder="e.g. Goat, Chicken"></div>
        <div class="form-group"><label>Quantity</label><input type="number" id="f-qty" placeholder="0"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Age Stage</label>
          <select id="f-stage">
            <option>Young</option><option>Adult</option><option>Breeding</option>
          </select>
        </div>
        <div class="form-group"><label>Health Status</label>
          <select id="f-health">
            <option>Healthy</option><option>Sick</option><option>Quarantine</option><option>Deceased</option>
          </select>
        </div>
      </div>
      <div class="form-group"><label>Note (optional)</label><textarea id="f-note" rows="2" placeholder="Any observations..."></textarea></div>
      <div style="display:flex;gap:1rem;margin-top:1rem;">
        <button class="btn btn-primary" onclick="saveRecord()" style="flex:2;">Save</button>
        <button class="btn secondary" onclick="closeModal()" style="flex:1;">Cancel</button>
      </div>
    </div>
  </div>

  <script src="../../assets/js/api-client.js"></script>
  <script src="../../assets/js/admin-layout.js"></script>
  <script>
    mountAdminLayout();
    authRequired().then(load);

    function openModal() { document.getElementById('modal').classList.add('open'); }
    function closeModal() { document.getElementById('modal').classList.remove('open'); }

    async function load() {
      const container = document.getElementById('livestock-container');
      try {
        const rows = await api("livestock.list");
        if (!rows.length) { container.innerHTML = '<p style="text-align:center;color:var(--text-muted);padding:2rem;">No livestock records yet.</p>'; return; }
        container.innerHTML = `<div class="table-responsive"><table>
          <thead><tr><th>Animal Type</th><th>Qty</th><th>Age Stage</th><th>Health</th><th>Note</th><th>Added</th></tr></thead>
          <tbody>${rows.map(r => {
            const hColor = r.health_status === 'Healthy' ? '#047857' : r.health_status === 'Sick' ? '#b91c1c' : '#b45309';
            return `<tr>
              <td><strong>${r.animal_type}</strong></td>
              <td>${r.quantity}</td>
              <td>${r.age_stage}</td>
              <td style="color:${hColor};font-weight:600;">${r.health_status}</td>
              <td>${r.note || '—'}</td>
              <td>${new Date(r.created_at).toLocaleDateString()}</td>
            </tr>`;
          }).join('')}</tbody>
        </table></div>`;
      } catch(e) { container.innerHTML = `<p style="color:red;text-align:center;">Error: ${e.message}</p>`; }
    }

    async function saveRecord() {
      const animal_type = document.getElementById('f-type').value.trim();
      const quantity = parseInt(document.getElementById('f-qty').value) || 0;
      const age_stage = document.getElementById('f-stage').value;
      const health_status = document.getElementById('f-health').value;
      const note = document.getElementById('f-note').value.trim();
      if (!animal_type) { toast('Animal type is required.'); return; }
      try {
        await api("livestock.create", "POST", {animal_type, quantity, age_stage, health_status, note});
        closeModal(); load();
      } catch(e) { toast("Error: " + e.message); }
    }
  </script>
</body>
</html>
