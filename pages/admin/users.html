<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Users | MTH GLOBAL RESOURCES Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <style>
    .header-banner { background: linear-gradient(135deg,var(--bg-card),var(--bg-alt)); padding:2.5rem 2rem; border-radius:var(--radius-lg); margin-bottom:2rem; border:1px solid var(--border-color); display:flex; align-items:center; gap:1.5rem; }
    .header-icon { background:rgba(100,116,139,0.1); color:#475569; width:60px; height:60px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1.5rem; }
    .badge-admin { background:rgba(30,58,138,0.1); color:#1e3a8a; }
    .badge-staff { background:rgba(59,130,246,0.1); color:#1d4ed8; }
    .badge-customer { background:rgba(6,182,212,0.1); color:#0891b2; }
  </style>
</head>
<body>
  <div id="layout"></div>
  <main class="container">
    <div class="header-banner">
      <div class="header-icon"><i class="fa-solid fa-users"></i></div>
      <div>
        <h1 style="margin:0;font-family:'Playfair Display',serif;">Manage Users</h1>
        <p style="margin:.5rem 0 0;color:var(--text-muted);">All registered users — admins, staff, and customers.</p>
      </div>
    </div>
    <section class="card">
      <div id="users-container">
        <div style="text-align:center;padding:4rem;"><i class="fa-solid fa-circle-notch fa-spin" style="font-size:2rem;color:var(--primary);"></i></div>
      </div>
    </section>
  </main>
  <script src="../../assets/js/api-client.js"></script>
  <script src="../../assets/js/admin-layout.js"></script>
  <script>
    mountAdminLayout();
    authRequired().then(load);

    async function load() {
      const container = document.getElementById('users-container');
      try {
        const rows = await api("admin.users.list");
        if (!rows.length) { container.innerHTML = '<p style="text-align:center;color:var(--text-muted);padding:2rem;">No users found.</p>'; return; }
        container.innerHTML = `<div class="table-responsive"><table>
          <thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Role</th><th>Address</th><th>Action</th></tr></thead>
          <tbody>${rows.map(u => `<tr>
            <td><strong>#${u.id}</strong></td>
            <td>${u.name}</td>
            <td>${u.email}</td>
            <td><span class="badge badge-${u.role}">${u.role}</span></td>
            <td style="max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${u.address || '—'}</td>
            <td>
              <div style="display:flex; gap:0.5rem; flex-wrap:wrap;">
                <button class="btn btn-ghost btn-small" onclick='openEdit(${JSON.stringify(u).replace(/'/g, "&apos;")})'>
                  <i class="fa-solid fa-pen-to-square"></i> Edit
                </button>
                <button class="btn btn-small" style="background:rgba(239,68,68,0.1); color:#dc2626; border:1px solid rgba(239,68,68,0.2); border-radius:var(--radius-md); cursor:pointer; font-family:'Inter',sans-serif; font-weight:600; font-size:0.8rem; transition:all 0.2s;" onmouseover="this.style.background='rgba(239,68,68,0.2)'" onmouseout="this.style.background='rgba(239,68,68,0.1)'" onclick='confirmDelete(${u.id}, "${u.name.replace(/"/g, '&quot;')}", "${u.role}")'>
                  <i class="fa-solid fa-trash-can"></i> Delete
                </button>
              </div>
            </td>
          </tr>`).join('')}</tbody>
        </table></div>`;
      } catch(e) { container.innerHTML = `<p style="color:red;text-align:center;">Error: ${e.message}</p>`; }
    }

    function openEdit(user) {
      const modal = document.createElement('div');
      modal.className = 'modal-backdrop';
      modal.innerHTML = `
        <div class="card modal-content" style="max-width:500px; width:90%; margin: 10vh auto; position:relative;">
          <h3>Edit User: ${user.name}</h3>
          <form id="editForm" style="margin-top:1.5rem;">
            <input type="hidden" name="user_id" value="${user.id}">
            <div class="form-group" style="margin-bottom:1rem;">
              <label>Full Name</label>
              <input type="text" name="name" value="${user.name}" required>
            </div>
            <div class="form-group" style="margin-bottom:1rem;">
              <label>Phone</label>
              <input type="text" name="phone" value="${user.phone || ''}">
            </div>
            <div class="form-group" style="margin-bottom:1rem;">
              <label>Delivery Address</label>
              <textarea name="address" rows="3" style="width:100%; border:1px solid var(--border-color); border-radius:var(--radius-md); padding:0.5rem;">${user.address || ''}</textarea>
            </div>
            <div class="form-group" style="margin-bottom:1.5rem;">
              <label>Role</label>
              <select name="role" style="width:100%; padding:0.5rem; border:1px solid var(--border-color); border-radius:var(--radius-md);">
                <option value="customer" ${user.role==='customer'?'selected':''}>Customer</option>
                <option value="staff" ${user.role==='staff'?'selected':''}>Staff</option>
                <option value="admin" ${user.role==='admin'?'selected':''}>Admin</option>
              </select>
            </div>
            <div style="display:flex; gap:1rem;">
              <button type="submit" class="btn btn-primary" style="flex:1;">Save Changes</button>
              <button type="button" class="btn btn-ghost" onclick="this.closest('.modal-backdrop').remove()" style="flex:1;">Cancel</button>
            </div>
          </form>
        </div>
      `;
      document.body.appendChild(modal);

      modal.querySelector('#editForm').onsubmit = async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const data = Object.fromEntries(fd.entries());
        try {
          await api("admin.users.update", "POST", data);
          toast("User updated successfully", "success");
          modal.remove();
          load();
        } catch(err) {
          toast(err.message, "error");
        }
      };
    }

    // Add CSS for modal
    const style = document.createElement('style');
    style.textContent = `
      .modal-backdrop { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:9999; backdrop-filter:blur(4px); }
      .form-group label { display:block; margin-bottom:0.4rem; font-weight:600; font-size:0.875rem; }
      .form-group input { width:100%; padding:0.6rem; border:1px solid var(--border-color); border-radius:var(--radius-md); }
      .delete-warning-icon { width:64px; height:64px; border-radius:50%; background:rgba(239,68,68,0.1); color:#dc2626; display:flex; align-items:center; justify-content:center; font-size:1.75rem; margin:0 auto 1.25rem; }
      .btn-danger { background:#dc2626; color:white; border:none; border-radius:var(--radius-md); padding:0.65rem 1.5rem; cursor:pointer; font-weight:600; font-family:'Inter',sans-serif; font-size:0.9rem; transition:all 0.2s; }
      .btn-danger:hover { background:#b91c1c; transform:translateY(-1px); box-shadow:0 4px 12px rgba(220,38,38,0.25); }
    `;
    document.head.appendChild(style);

    function confirmDelete(userId, userName, userRole) {
      if (userRole === 'admin') {
        toast("Admin accounts cannot be deleted from this panel.", "warning");
        return;
      }

      const modal = document.createElement('div');
      modal.className = 'modal-backdrop';
      modal.innerHTML = `
        <div class="card modal-content" style="max-width:440px; width:90%; margin:15vh auto; position:relative; text-align:center;">
          <div class="delete-warning-icon">
            <i class="fa-solid fa-triangle-exclamation"></i>
          </div>
          <h3 style="margin-bottom:0.5rem;">Delete User?</h3>
          <p style="color:var(--text-muted); margin-bottom:0.25rem;">You are about to permanently delete:</p>
          <p style="font-weight:700; font-size:1.1rem; margin-bottom:0.25rem;">${userName}</p>
          <p style="margin-bottom:1.5rem;"><span class="badge badge-${userRole}">${userRole}</span></p>
          <p style="color:#dc2626; font-size:0.85rem; margin-bottom:1.5rem;"><i class="fa-solid fa-circle-exclamation"></i> This action cannot be undone. All associated data (orders, cart, wishlist) will be removed.</p>
          <div style="display:flex; gap:1rem;">
            <button type="button" class="btn btn-ghost" onclick="this.closest('.modal-backdrop').remove()" style="flex:1;">Cancel</button>
            <button type="button" class="btn-danger" onclick="deleteUser(${userId}, this)" style="flex:1;">
              <i class="fa-solid fa-trash-can"></i> Delete
            </button>
          </div>
        </div>
      `;
      document.body.appendChild(modal);

      // Close on backdrop click
      modal.addEventListener('click', (e) => {
        if (e.target === modal) modal.remove();
      });
    }

    async function deleteUser(userId, btn) {
      const originalText = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Deleting...';
      try {
        await api("admin.users.delete", "POST", { user_id: userId });
        toast("User deleted successfully", "success");
        btn.closest('.modal-backdrop').remove();
        load();
      } catch(err) {
        toast(err.message, "error");
        btn.disabled = false;
        btn.innerHTML = originalText;
      }
    }
  </script>
</body>
</html>
