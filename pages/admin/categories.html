<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Categories | MTH GLOBAL RESOURCES Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <style>
    .header-banner { background: linear-gradient(135deg,#4c1d95,#7c3aed); padding:2.5rem 2rem; border-radius:var(--radius-lg); margin-bottom:2rem; border:1px solid var(--border-color); display:flex; align-items:center; gap:1.5rem; color:white; }
    .header-icon { background:rgba(255,255,255,0.2); color:white; width:60px; height:60px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1.5rem; }
    .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:1000; align-items:center; justify-content:center; }
    .modal-overlay.open { display:flex; }
    .modal { background:var(--bg-card); border-radius:var(--radius-lg); padding:2rem; width:90%; max-width:400px; box-shadow:var(--shadow-lg); }
    .form-group { margin-bottom:1rem; }
    .form-group label { display:block; font-size:.875rem; font-weight:600; margin-bottom:.4rem; color:var(--text-main); }
    .form-group input { width:100%; padding:.7rem 1rem; border:1px solid var(--border-color); border-radius:var(--radius-md); font-family:'Inter',sans-serif; }
  </style>
</head>
<body>
  <div id="layout"></div>
  <main class="container">
    <div class="header-banner">
      <div class="header-icon"><i class="fa-solid fa-tags"></i></div>
      <div>
        <h1 style="margin:0;font-family:'Playfair Display',serif;color:white;">Product Categories</h1>
        <p style="margin:.5rem 0 0;opacity:0.8;">Create and manage categories for your beverage products.</p>
      </div>
    </div>
    
    <div class="grid grid-3">
      <section class="card col-span-1" style="height:fit-content;">
        <h3 style="margin-bottom:1.5rem;" id="form-title">Add New Category</h3>
        <form id="category-form">
          <input type="hidden" id="f-id">
          <div class="form-group">
            <label>Category Name</label>
            <input type="text" id="f-name" placeholder="e.g. Fruits" required>
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%;" id="save-btn">Save Category</button>
          <button type="button" class="btn secondary" style="width:100%;margin-top:.5rem;display:none;" id="cancel-btn" onclick="resetForm()">Cancel Edit</button>
        </form>
      </section>

      <section class="card col-span-2">
        <div id="categories-container">
          <div style="text-align:center;padding:4rem;"><i class="fa-solid fa-circle-notch fa-spin" style="font-size:2rem;color:var(--primary);"></i></div>
        </div>
      </section>
    </div>
  </main>

  <script src="../../assets/js/api-client.js"></script>
  <script src="../../assets/js/admin-layout.js"></script>
  <script src="../../assets/js/pages/common.js"></script>
  <script>
    mountAdminLayout();
    authRequired().then(load);

    const form = document.getElementById('category-form');
    const saveBtn = document.getElementById('save-btn');
    const cancelBtn = document.getElementById('cancel-btn');
    const formTitle = document.getElementById('form-title');

    function resetForm() {
      form.reset();
      document.getElementById('f-id').value = '';
      formTitle.textContent = 'Add New Category';
      cancelBtn.style.display = 'none';
      saveBtn.textContent = 'Save Category';
    }

    async function load() {
      const container = document.getElementById('categories-container');
      try {
        const rows = await api("categories.list");
        if (!rows.length) { container.innerHTML = '<p style="text-align:center;color:var(--text-muted);padding:2rem;">No categories yet.</p>'; return; }
        container.innerHTML = `<div class="table-responsive"><table>
          <thead><tr><th>Name</th><th style="text-align:right;">Actions</th></tr></thead>
          <tbody>${rows.map(c => `<tr>
            <td><strong>${c.name}</strong></td>
            <td style="text-align:right;">
              <button class="btn btn-ghost btn-small" onclick="editCategory(${c.id}, '${c.name.replace(/'/g, "\\'")}')"><i class="fa-solid fa-edit"></i></button>
              <button class="btn btn-ghost btn-small" style="color:#ef4444;" onclick="deleteCategory(${c.id})"><i class="fa-solid fa-trash"></i></button>
            </td>
          </tr>`).join('')}</tbody>
        </table></div>`;
      } catch(e) { container.innerHTML = `<p style="color:red;text-align:center;">Error: ${e.message}</p>`; }
    }

    function editCategory(id, name) {
      document.getElementById('f-id').value = id;
      document.getElementById('f-name').value = name;
      formTitle.textContent = 'Edit Category';
      cancelBtn.style.display = 'block';
      saveBtn.textContent = 'Update Category';
      document.getElementById('f-name').focus();
    }

    form.onsubmit = async (e) => {
      e.preventDefault();
      const id = document.getElementById('f-id').value;
      const name = document.getElementById('f-name').value.trim();
      
      saveBtn.disabled = true;
      saveBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Saving...';

      try {
        if (id) {
          await api("categories.update", "POST", {id, name});
          toast("Category updated successfully!", "success");
        } else {
          await api("categories.create", "POST", {name});
          toast("Category created successfully!", "success");
        }
        resetForm();
        load();
      } catch(e) {
        toast(e.message, "error");
      } finally {
        saveBtn.disabled = false;
        saveBtn.innerHTML = id ? 'Update Category' : 'Save Category';
      }
    };

    async function deleteCategory(id) {
      if (!confirm("Are you sure you want to delete this category? Products in this category will not be deleted but they will lose their category tag.")) return;
      try {
        await api("categories.delete", "POST", {id});
        toast("Category deleted", "success");
        load();
      } catch(e) { toast(e.message, "error"); }
    }
  </script>
</body>
</html>
