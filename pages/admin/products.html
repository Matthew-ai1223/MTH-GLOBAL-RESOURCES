<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Products | MTH GLOBAL RESOURCES Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <style>
    .header-banner { background: linear-gradient(135deg,var(--bg-card),var(--bg-alt)); padding:2.5rem 2rem; border-radius:var(--radius-lg); margin-bottom:2rem; border:1px solid var(--border-color); display:flex; align-items:center; gap:1.5rem; }
    .header-icon { background:rgba(6,182,212,0.1); color:#0e7490; width:60px; height:60px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1.5rem; }
    .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:1000; align-items:center; justify-content:center; }
    .modal-overlay.open { display:flex; }
    .modal { background:var(--bg-card); border-radius:var(--radius-lg); padding:2rem; width:90%; max-width:520px; box-shadow:var(--shadow-lg); }
    .form-group { margin-bottom:1rem; }
    .form-group label { display:block; font-size:.875rem; font-weight:600; margin-bottom:.4rem; color:var(--text-main); }
    .form-group input, .form-group select, .form-group textarea { width:100%; padding:.7rem 1rem; border:1px solid var(--border-color); border-radius:var(--radius-md); font-family:'Inter',sans-serif; }
    .form-row { display:grid; grid-template-columns:1fr 1fr; gap:1rem; }
  </style>
</head>
<body>
  <div id="layout"></div>
  <main class="container">
    <div class="header-banner">
      <div class="header-icon"><i class="fa-solid fa-bottle-water"></i></div>
      <div>
        <h1 style="margin:0;font-family:'Playfair Display',serif;">Manage Products</h1>
        <p style="margin:.5rem 0 0;color:var(--text-muted);">Add, edit, and manage your beverage products.</p>
      </div>
    </div>
    <section class="card">
      <div class="toolbar" style="justify-content:space-between;margin-bottom:1.5rem;">
        <h2 style="font-size:1.25rem;margin:0;">Product Catalogue</h2>
        <button class="btn btn-primary btn-small" onclick="openModal()"><i class="fa-solid fa-plus"></i> Add Product</button>
      </div>
      <div id="products-container">
        <div style="text-align:center;padding:4rem;"><i class="fa-solid fa-circle-notch fa-spin" style="font-size:2rem;color:var(--primary);"></i></div>
      </div>
    </section>
  </main>

  <!-- Product Modal -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;">
        <h3 style="margin:0;" id="modal-title">Add New Product</h3>
        <button onclick="closeModal()" style="background:none;border:none;font-size:1.25rem;cursor:pointer;color:var(--text-muted);"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <input type="hidden" id="f-id">
      <div class="form-group"><label>Product Name</label><input type="text" id="f-name" placeholder="e.g. Aqua Pure Still Water 1.5L"></div>
      <div class="form-group"><label>Description</label><textarea id="f-desc" rows="2" placeholder="Short description..."></textarea></div>
      <div class="form-row">
        <div class="form-group"><label>Price (₦)</label><input type="number" id="f-price" placeholder="0.00"></div>
        <div class="form-group"><label>Stock (units)</label><input type="number" id="f-stock" placeholder="0"></div>
      </div>
      <div class="form-group">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:.4rem;">
          <label style="margin:0;">Category</label>
          <a href="categories.html" style="font-size:0.75rem; color:var(--primary); font-weight:700; text-decoration:none;">Manage Categories</a>
        </div>
        <select id="f-category">
          <option value="">Select Category</option>
        </select>
      </div>
      
      <div class="form-group">
        <label>Product Image</label>
        <div style="display:flex; gap:1rem; align-items:center;">
          <div id="image-preview" style="width:80px; height:80px; border:2px dashed var(--border-color); border-radius:var(--radius-md); display:flex; align-items:center; justify-content:center; overflow:hidden; background:var(--bg-alt);">
            <i class="fa-solid fa-image" style="color:var(--text-muted);"></i>
          </div>
          <div style="flex:1;">
            <input type="file" id="f-image-file" accept="image/*" style="font-size:0.8rem; margin-bottom:0.5rem;" onchange="previewImage(this)">
            <p style="margin:0; font-size:0.75rem; color:var(--text-muted);">Or paste URL below:</p>
            <input type="url" id="f-image-url" placeholder="https://..." style="padding:.4rem .75rem; margin-top:0.25rem;">
          </div>
        </div>
      </div>

      <div style="display:flex;gap:1rem;margin-top:1.5rem;">
        <button class="btn btn-primary" id="save-btn" onclick="saveProduct()" style="flex:2;">Save Product</button>
        <button class="btn secondary" onclick="closeModal()" style="flex:1;">Cancel</button>
      </div>
    </div>
  </div>

  <script src="../../assets/js/api-client.js"></script>
  <script src="../../assets/js/admin-layout.js"></script>
  <script src="../../assets/js/pages/common.js"></script>
  <script>
    mountAdminLayout();
    authRequired().then(load);

    async function loadCategories() {
      const select = document.getElementById('f-category');
      try {
        const cats = await api("categories.list");
        select.innerHTML = '<option value="">Select Category</option>' + 
          cats.map(c => `<option value="${c.name}">${c.name}</option>`).join('');
      } catch(e) { console.error("Error loading categories", e); }
    }

    function openModal() { 
      document.getElementById('modal-title').textContent = 'Add New Product';
      document.getElementById('save-btn').textContent = 'Save Product';
      document.getElementById('modal').classList.add('open'); 
      resetForm();
      loadCategories();
    }
    function closeModal() { document.getElementById('modal').classList.remove('open'); }

    function resetForm() {
      document.getElementById('f-id').value = '';
      document.getElementById('f-name').value = '';
      document.getElementById('f-desc').value = '';
      document.getElementById('f-price').value = '';
      document.getElementById('f-stock').value = '';
      document.getElementById('f-category').value = '';
      document.getElementById('f-image-url').value = '';
      document.getElementById('f-image-file').value = '';
      document.getElementById('image-preview').innerHTML = '<i class="fa-solid fa-image" style="color:var(--text-muted);"></i>';
    }

    function previewImage(input) {
      const preview = document.getElementById('image-preview');
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          preview.innerHTML = `<img src="${e.target.result}" style="width:100%; height:100%; object-fit:cover;">`;
        }
        reader.readAsDataURL(input.files[0]);
      }
    }

    async function load() {
      const container = document.getElementById('products-container');
      try {
        const rows = await api("products.list");
        if (!rows.length) { container.innerHTML = '<p style="text-align:center;color:var(--text-muted);padding:2rem;">No products yet. Add the first one!</p>'; return; }
        container.innerHTML = `<div class="table-responsive"><table>
          <thead><tr><th>ID</th><th>Image</th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th style="text-align:right;">Actions</th></tr></thead>
          <tbody>${rows.map(p => `<tr>
            <td><strong>#${p.id}</strong></td>
            <td><img src="${getProductImageUrl(p.image_url)}" style="width:40px;height:40px;border-radius:4px;object-fit:cover;border:1px solid var(--border-color);"></td>
            <td>${p.name}</td>
            <td><span class="badge badge-success">${p.category}</span></td>
            <td style="font-weight:700;">₦${Number(p.price).toLocaleString('en-NG',{minimumFractionDigits:2})}</td>
            <td>
              ${Number(p.stock) <= 0 
                ? '<span style="color: #ef4444; font-weight:700;">Out of Stock</span>' 
                : (Number(p.stock) <= 10 
                    ? `<span style="color: #b45309; font-weight:700;">${p.stock} Left</span>` 
                    : '<span style="color: #059669;">In Stock</span>')
              }
            </td>
            <td style="text-align:right;">
              <button class="btn btn-ghost btn-small" onclick="editProduct(${JSON.stringify(p).replace(/"/g, '&quot;')})"><i class="fa-solid fa-edit"></i></button>
              <button class="btn btn-ghost btn-small" style="color:#ef4444;" onclick="deleteProduct(${p.id})"><i class="fa-solid fa-trash"></i></button>
            </td>
          </tr>`).join('')}</tbody>
        </table></div>`;
      } catch(e) { container.innerHTML = `<p style="color:red;text-align:center;">Error: ${e.message}</p>`; }
    }

    async function editProduct(p) {
      await loadCategories();
      document.getElementById('modal-title').textContent = 'Edit Product';
      document.getElementById('save-btn').textContent = 'Update Product';
      document.getElementById('f-id').value = p.id;
      document.getElementById('f-name').value = p.name;
      document.getElementById('f-desc').value = p.description || '';
      document.getElementById('f-price').value = p.price;
      document.getElementById('f-stock').value = p.stock;
      document.getElementById('f-category').value = p.category;
      document.getElementById('f-image-url').value = p.image_url || '';
      if (p.image_url) {
        document.getElementById('image-preview').innerHTML = `<img src="${getProductImageUrl(p.image_url)}" style="width:100%; height:100%; object-fit:cover;">`;
      }
      document.getElementById('modal').classList.add('open');
    }

    async function deleteProduct(id) {
      if (!confirm("Are you sure you want to delete this product?")) return;
      try {
        await api("products.delete", "POST", {id});
        toast("Product deleted successfully");
        load();
      } catch(e) { toast("Error: " + e.message); }
    }

    async function saveProduct() {
      const saveBtn = document.getElementById('save-btn');
      const id = document.getElementById('f-id').value;
      const name = document.getElementById('f-name').value.trim();
      const description = document.getElementById('f-desc').value.trim();
      const price = parseFloat(document.getElementById('f-price').value);
      const stock = parseInt(document.getElementById('f-stock').value);
      const category = document.getElementById('f-category').value.trim();
      const imageFile = document.getElementById('f-image-file').files[0];
      let image_url = document.getElementById('f-image-url').value.trim();

      if (!name || isNaN(price) || !category) { toast('Name, price, and category are required.'); return; }
      
      saveBtn.disabled = true;
      saveBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Saving...';

      try {
        // 1. Handle Upload if file selected
        if (imageFile) {
          const formData = new FormData();
          formData.append('image', imageFile);
          const uploadRes = await api("uploads.image", "POST", formData);
          image_url = uploadRes.url;
        }

        // 2. Save/Update Product
        if (id) {
          await api("products.update", "POST", {id, name, description, price, stock, category, image_url});
          toast("Product updated successfully!", "success");
        } else {
          await api("products.create", "POST", {name, description, price, stock, category, image_url});
          toast("Product added successfully!", "success");
        }
        
        closeModal();
        load();
      } catch(e) { 
        toast("Failed to save: " + e.message); 
      } finally {
        saveBtn.disabled = false;
        saveBtn.innerHTML = 'Save Product';
      }
    }
  </script>
</body>
</html>
