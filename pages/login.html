<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | MTH GLOBAL RESOURCES</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap"
    rel="stylesheet">

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <!-- Styles -->
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <style>
    body {
      background: linear-gradient(135deg, #eff6ff 0%, #f8fafc 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .auth-container {
      max-width: 450px;
      width: 100%;
      margin: auto;
      padding: 2rem 1rem;
    }

    .auth-card {
      background: var(--bg-card);
      padding: 2.5rem;
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-xl);
      border: 1px solid var(--border-color);
    }

    .auth-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .auth-header .brand {
      justify-content: center;
      margin-bottom: 1rem;
      font-size: 2rem;
    }

    .auth-header h1 {
      font-size: 1.75rem;
      color: var(--primary-dark);
      margin-bottom: 0.5rem;
    }

    .auth-header p {
      color: var(--text-muted);
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
      font-size: 0.875rem;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper i {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    .input-wrapper input {
      width: 100%;
      padding-left: 2.75rem;
    }

    .auth-footer {
      margin-top: 2rem;
      text-align: center;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .auth-footer a {
      color: var(--primary);
      font-weight: 600;
    }

    .auth-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <div id="layout"></div>

  <main class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <a href="../index.html" class="brand">
          <i class="fa-solid fa-droplet"></i> MTH GLOBAL
        </a>
        <h1>Welcome Back</h1>
        <p>Access your beverage store account</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email Address</label>
          <div class="input-wrapper">
            <i class="fa-regular fa-envelope"></i>
            <input name="email" id="email" type="email" placeholder="name@example.com" required>
          </div>
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
            <label for="password" style="margin-bottom: 0;">Password</label>
            <a href="./reset-password.html"
              style="font-size: 0.75rem; color: var(--primary); font-weight: 600;">Forgot?</a>
          </div>
          <div class="input-wrapper">
            <i class="fa-solid fa-lock"></i>
            <input name="password" id="password" type="password" placeholder="••••••••" required>
          </div>
        </div>

        <div class="form-group" style="display: flex; align-items: center; gap: 0.5rem; margin-top: -0.5rem; margin-bottom: 1.5rem;">
          <input type="checkbox" name="remember" id="remember" style="width: auto; cursor: pointer;">
          <label for="remember" style="margin: 0; font-weight: 500; cursor: pointer; color: var(--text-muted);">Remember me</label>
        </div>

        <button type="submit" style="width: 100%; margin-top: 1rem;">
          Sign In <i class="fa-solid fa-right-to-bracket"></i>
        </button>
      </form>

      <div class="auth-footer">
        <p>Don't have an account? <a href="./register.html">Create one</a></p>
      </div>
    </div>
  </main>

  <script src="../assets/js/api-client.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script>
    mountLayout();
    
    async function checkAuth() {
      try {
        const res = await api("auth.me");
        if (res && res.role) {
          document.querySelector('.auth-card').innerHTML = `
            <div style="text-align: center; padding: 2rem 0;">
              <i class="fa-solid fa-circle-check" style="font-size: 4rem; color: var(--primary); margin-bottom: 1rem;"></i>
              <h2 style="font-family: 'Playfair Display', serif; color: var(--primary-dark);">You're already logged in!</h2>
              <p style="color: var(--text-muted); margin-bottom: 2rem;">Redirecting you to your dashboard...</p>
              <i class="fa-solid fa-circle-notch fa-spin" style="font-size: 2rem; color: var(--primary);"></i>
            </div>
          `;
          setTimeout(() => {
            location.href = res.role === 'admin' ? "./admin/dashboard.html" : res.role === 'staff' ? "./staff/dashboard.html" : "./customer/dashboard.html";
          }, 2000);
        }
      } catch (e) {
        // Not logged in, proceed with showing the login form
      }
    }
    checkAuth();
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const submitBtn = e.target.querySelector('button');
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Signing in...';

      try {
        const fd = new FormData(e.target);
        const data = Object.fromEntries(fd.entries());
        const res = await api("auth.login", "POST", data);
        toast("Welcome back! Redirecting...", "success");
        setTimeout(() => {
          location.href = res.role === 'admin' ? "./admin/dashboard.html" : res.role === 'staff' ? "./staff/dashboard.html" : "./customer/dashboard.html";
        }, 1000);
      } catch (err) {
        if (err.message.includes('not verified')) {
          const email = document.getElementById('email').value;
          toast("Account not verified. Redirecting to verification...", "warning");
          setTimeout(() => {
            location.href = `./register.html?verify=${encodeURIComponent(email)}`;
          }, 1500);
        } else {
          toast(err.message || "Login failed. Please check your credentials.", "error");
          submitBtn.disabled = false;
          submitBtn.innerHTML = 'Sign In <i class="fa-solid fa-right-to-bracket"></i>';
        }
      }
    });
  </script>
</body>

</html>
