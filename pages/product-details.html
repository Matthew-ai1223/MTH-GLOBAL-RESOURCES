<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details | MTH GLOBAL RESOURCES</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  
  <!-- Styles -->
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <style>
    body {
      font-family: 'Outfit', 'Inter', sans-serif;
      background-color: #f8fafc;
      color: var(--text-main);
    }
    
    /* Breadcrumbs */
    .breadcrumbs {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-bottom: 2rem;
      flex-wrap: wrap;
      background: white;
      padding: 0.85rem 1.25rem;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }
    .breadcrumbs a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: var(--transition);
    }
    .breadcrumbs a:hover {
      color: var(--primary-dark);
      text-decoration: underline;
    }

    /* Details Panel Card */
    .details-card {
      background: white;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 20px rgba(0,0,0,0.03);
      padding: 3rem;
      margin-bottom: 3.5rem;
    }
    
    .product-details-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4rem;
      align-items: start;
    }
    
    /* Visuals Column */
    .image-panel {
      position: relative;
      background: #fcfdfc;
      border-radius: var(--radius-lg);
      overflow: hidden;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
    }
    .image-panel:hover {
      box-shadow: var(--shadow-md);
    }
    .image-panel img {
      width: 100%;
      height: auto;
      aspect-ratio: 1.05;
      object-fit: cover;
      display: block;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .image-panel:hover img {
      transform: scale(1.04);
    }
    
    /* Info Column */
    .category-badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--primary);
      background: rgba(59, 130, 246, 0.08);
      padding: 0.4rem 1rem;
      border-radius: 99px;
      margin-bottom: 1.25rem;
      border: 1px solid rgba(59, 130, 246, 0.15);
    }
    
    /* Stock Indicators */
    .stock-indicator {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 0.4rem 0.85rem;
      border-radius: 8px;
      margin-bottom: 1.5rem;
    }
    .stock-indicator.in-stock {
      background: #ecfdf5;
      color: #065f46;
      border: 1px solid #d1fae5;
    }
    .stock-indicator.low-stock {
      background: #fffbeb;
      color: #92400e;
      border: 1px solid #fef3c7;
    }
    .stock-indicator.out-of-stock {
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fee2e2;
    }
    .stock-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .stock-indicator.in-stock .stock-dot {
      background: #10b981;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.25);
    }
    .stock-indicator.low-stock .stock-dot {
      background: #f59e0b;
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.25);
    }
    .stock-indicator.out-of-stock .stock-dot {
      background: #ef4444;
    }
    .pulse {
      animation: pulse-animation 2s infinite;
    }
    @keyframes pulse-animation {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.5); }
      70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }
    
    .price-block {
      font-size: 2.75rem;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 1.5rem;
      font-family: 'Outfit', sans-serif;
      letter-spacing: -1px;
    }
    
    .desc-block {
      font-size: 1.05rem;
      line-height: 1.7;
      color: var(--text-muted);
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 2rem;
    }
    
    /* Stepper & Actions Panel */
    .quantity-selector-label {
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .quantity-control {
      display: flex;
      align-items: center;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      overflow: hidden;
      width: 140px;
      background: #f9fafb;
    }
    .quantity-btn {
      width: 45px;
      height: 45px;
      background: transparent;
      border: none;
      color: var(--text-main);
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
    }
    .quantity-btn:hover:not(:disabled) {
      background: var(--border-color);
      color: var(--primary);
    }
    .quantity-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .quantity-input {
      width: 50px;
      height: 45px;
      border: none;
      border-left: 1px solid var(--border-color);
      border-right: 1px solid var(--border-color);
      text-align: center;
      font-weight: 700;
      font-size: 1.1rem;
      background: #ffffff;
      color: var(--text-main);
    }
    
    .actions-panel {
      display: flex;
      gap: 1.25rem;
      margin-top: 2rem;
      margin-bottom: 2.5rem;
    }
    .btn-add-cart {
      flex: 2.5;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      background: linear-gradient(135deg, #3b82f6 0%, #1e3a8a 100%);
      color: white;
      font-weight: 700;
      font-size: 1.1rem;
      border: none;
      padding: 0.95rem 2rem;
      border-radius: var(--radius-md);
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(59, 130, 246, 0.35);
      transition: var(--transition);
      font-family: 'Outfit', sans-serif;
    }
    .btn-add-cart:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(59, 130, 246, 0.45);
    }
    .btn-add-cart:disabled {
      background: #9ca3af;
      cursor: not-allowed;
      box-shadow: none;
      opacity: 0.6;
    }
    .btn-wishlist {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      font-weight: 700;
      border: 1px solid var(--border-color);
      background: white;
      color: var(--text-main);
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: var(--transition);
      font-family: 'Outfit', sans-serif;
    }
    .btn-wishlist:hover {
      border-color: #fca5a5;
      color: #ef4444;
      background: #fef2f2;
    }
    .btn-wishlist.active {
      background: #fee2e2;
      border-color: #fca5a5;
      color: #ef4444;
    }
    
    /* Trust Panel */
    .trust-panel {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.5rem;
      padding: 1.5rem;
      background: #f0f9ff;
      border-radius: var(--radius-lg);
      border: 1px dashed rgba(14, 165, 233, 0.3);
      margin-bottom: 3.5rem;
    }
    .trust-badge-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 0.5rem;
    }
    .trust-badge-item i {
      font-size: 1.4rem;
      color: var(--primary);
      background: rgba(59, 130, 246, 0.1);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .trust-badge-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--primary-dark);
    }
    .trust-badge-desc {
      font-size: 0.75rem;
      color: var(--text-muted);
      line-height: 1.35;
    }
    
    /* Specifications Tabs */
    .tabs-header {
      display: flex;
      border-bottom: 2px solid var(--border-color);
      margin-bottom: 1.5rem;
      gap: 2rem;
    }
    .tab-btn {
      background: transparent;
      border: none;
      padding: 0.85rem 0.5rem;
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      position: relative;
      transition: var(--transition);
      font-family: 'Outfit', sans-serif;
    }
    .tab-btn:hover {
      color: var(--primary);
    }
    .tab-btn.active {
      color: var(--primary);
      font-weight: 700;
    }
    .tab-btn.active::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 100%;
      height: 2px;
      background: var(--primary);
    }
    .tab-content {
      display: none;
      font-size: 0.975rem;
      line-height: 1.7;
      color: var(--text-muted);
    }
    .tab-content.active {
      display: block;
      animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Similar Products */
    .similar-products {
      margin-top: 5rem;
      border-top: 1px solid var(--border-color);
      padding-top: 4rem;
    }
    .similar-products h2 {
      font-family: 'Playfair Display', serif;
      font-size: 2.25rem;
      margin-bottom: 2.5rem;
      color: var(--primary-dark);
      text-align: center;
      position: relative;
    }
    .similar-products h2::after {
      content: '';
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 3px;
      background: var(--primary);
      border-radius: 99px;
    }
    
    .similar-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 2rem;
    }
    .similar-card {
      background: white;
      border-radius: var(--radius-lg);
      overflow: hidden;
      border: 1px solid var(--border-color);
      transition: var(--transition);
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
    }
    .similar-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
      border-color: rgba(59, 130, 246, 0.3);
    }
    .similar-card img {
      width: 100%;
      aspect-ratio: 1.1;
      object-fit: cover;
      transition: transform 0.5s ease;
    }
    .similar-card:hover img {
      transform: scale(1.03);
    }
    .similar-card-body {
      padding: 1.25rem;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .similar-card-body h3 {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 0.5rem;
      line-height: 1.4;
    }
    .similar-card-price {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--primary);
      margin-top: auto;
    }
    
    /* Responsiveness */
    @media (max-width: 992px) {
      .product-details-container {
        grid-template-columns: 1fr;
        gap: 3rem;
      }
      .details-card {
        padding: 2rem;
      }
      .similar-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    
    @media (max-width: 576px) {
      .details-card {
        padding: 1.25rem;
      }
      .trust-panel {
        grid-template-columns: 1fr;
        gap: 1.25rem;
      }
      .similar-grid {
        grid-template-columns: 1fr;
      }
      .price-block {
        font-size: 2.25rem;
      }
    }
  </style>
</head>
<body>
  <div id="layout"></div>
  <main class="container" style="padding: 4rem 1rem;">
    <!-- Main Dynamic Details Viewer -->
    <div id="view">
      <div style="text-align: center; padding: 6rem 0;">
        <i class="fa-solid fa-circle-notch fa-spin" style="font-size: 2.5rem; color: var(--primary);"></i>
      </div>
    </div>

    <!-- Similar Products Recommended Slider -->
    <div id="similar-view" class="similar-products" style="display: none;">
      <h2>Recommended Items</h2>
      <div id="similar-grid" class="similar-grid" style="margin-top: 1.5rem;"></div>
    </div>
  </main>
  
  <script src="../assets/js/api-client.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script>
    mountLayout();
    const id = new URLSearchParams(location.search).get("id");
    
    async function load() {
      if (!id) {
        document.getElementById('view').innerHTML = `
          <div style="text-align: center; padding: 4rem 2rem; background:white; border-radius:var(--radius-lg); border:1px solid var(--border-color);">
            <i class="fa-solid fa-triangle-exclamation" style="font-size:3rem; color:#ef4444; margin-bottom:1rem;"></i>
            <p style="font-weight:700; color:var(--text-main); font-size:1.2rem;">No Product Selected</p>
            <p style="color:var(--text-muted); margin-bottom:1.5rem;">Please navigate from the shop catalog to view item details.</p>
            <a href="shop.html" class="btn btn-primary">Go to Shop</a>
          </div>`;
        return;
      }

      try {
        const p = await api(`products.details&id=${id}`);
        const priceFmt = Number(p.price).toLocaleString('en-NG', {minimumFractionDigits: 2, maximumFractionDigits: 2});

        // Resolve Stock Indicator Markup
        let stockHtml = '';
        if (Number(p.stock) <= 0) {
          stockHtml = `<div class="stock-indicator out-of-stock"><span class="stock-dot"></span> Out of Stock</div>`;
        } else if (Number(p.stock) <= 5) {
          stockHtml = `<div class="stock-indicator low-stock"><span class="stock-dot pulse"></span> Low Stock: only ${p.stock} units left!</div>`;
        } else {
          stockHtml = `<div class="stock-indicator in-stock"><span class="stock-dot pulse"></span> ${p.stock} units available</div>`;
        }

        // Fetch user's wishlist to determine initial toggle state
        let isWishlisted = false;
        try {
          const wishItems = await api("wishlist.list");
          isWishlisted = wishItems.some(item => Number(item.product_id) === Number(p.id));
        } catch(e) {}

        document.getElementById('view').innerHTML = `
          <!-- Dynamically Structured Breadcrumbs -->
          <nav class="breadcrumbs">
            <a href="../index.html">Home</a>
            <i class="fa-solid fa-chevron-right" style="font-size:0.7rem; opacity:0.5;"></i>
            <a href="shop.html">Shop</a>
            <i class="fa-solid fa-chevron-right" style="font-size:0.7rem; opacity:0.5;"></i>
            <a href="shop.html?category=${encodeURIComponent(p.category)}">${p.category}</a>
            <i class="fa-solid fa-chevron-right" style="font-size:0.7rem; opacity:0.5;"></i>
            <span style="color:var(--text-main); font-weight:600;">${p.name}</span>
          </nav>

          <!-- Core Grid Panels -->
          <div class="details-card">
            <div class="product-details-container">
              <!-- Left: Image Panel -->
              <div class="image-panel">
                <img src="${getProductImageUrl(p.image_url)}" alt="${p.name}">
              </div>

              <!-- Right: Content details -->
              <div class="product-info">
                <span class="category-badge">${p.category}</span>
                <h1 style="font-family:'Playfair Display', serif; font-size:2.6rem; font-weight:800; color:var(--primary-dark); margin-bottom:0.75rem; line-height:1.25;">${p.name}</h1>
                
                ${stockHtml}
                
                <div class="price-block">₦${priceFmt}</div>
                <p class="desc-block">${p.description || 'Premium beverage packaged and sealed under state-of-the-art hygiene standards. Refreshing and delicious!'}</p>
                
                <!-- Stepper & Actions panel -->
                <div class="quantity-selector-label">Quantity</div>
                <div style="display:flex; align-items:center; gap:1.5rem; flex-wrap:wrap; margin-bottom:2.5rem;">
                  <div class="quantity-control">
                    <button class="quantity-btn" id="qty-minus" type="button" ${Number(p.stock) <= 0 ? 'disabled' : ''}><i class="fa-solid fa-minus"></i></button>
                    <input class="quantity-input" id="qty-val" type="number" value="${Number(p.stock) > 0 ? 1 : 0}" min="${Number(p.stock) > 0 ? 1 : 0}" max="${p.stock}" readonly>
                    <button class="quantity-btn" id="qty-plus" type="button" ${Number(p.stock) <= 0 ? 'disabled' : ''}><i class="fa-solid fa-plus"></i></button>
                  </div>
                  
                  <div style="flex:1; display:flex; gap:1rem; min-width:250px;">
                    <button id="addCart" class="btn-add-cart" ${Number(p.stock) <= 0 ? 'disabled' : ''}>
                      <i class="fa-solid fa-cart-plus"></i> Add to Cart
                    </button>
                    <button id="addWish" class="btn-wishlist ${isWishlisted ? 'active' : ''}">
                      <i class="fa-solid fa-heart"></i> <span id="wish-txt">${isWishlisted ? 'Saved' : 'Save'}</span>
                    </button>
                  </div>
                </div>

                <!-- Farm Trust Panel -->
                <div class="trust-panel">
                  <div class="trust-badge-item">
                    <i class="fa-solid fa-droplet"></i>
                    <span class="trust-badge-title">100% Pure</span>
                    <span class="trust-badge-desc">Premium quality certified beverages</span>
                  </div>
                  <div class="trust-badge-item">
                    <i class="fa-solid fa-truck-fast"></i>
                    <span class="trust-badge-title">Express Logistics</span>
                    <span class="trust-badge-desc">Directly delivered to your home</span>
                  </div>
                  <div class="trust-badge-item">
                    <i class="fa-solid fa-shield-halved"></i>
                    <span class="trust-badge-title">Hygienically Packed</span>
                    <span class="trust-badge-desc">Strict contamination safety</span>
                  </div>
                </div>

                <!-- Specifications Tabs System -->
                <div class="tabs-header">
                  <button class="tab-btn active" data-tab="tab-desc">Overview</button>
                  <button class="tab-btn" data-tab="tab-origin">Production Quality</button>
                  <button class="tab-btn" data-tab="tab-delivery">Shipping Policy</button>
                </div>
                
                <div id="tab-desc" class="tab-content active">
                  <p>${p.description || 'No detailed specifications are currently provided. Contact MTH GLOBAL RESOURCES support for additional requests.'}</p>
                </div>
                
                <div id="tab-origin" class="tab-content">
                  <p>Produced and bottled under the highest standards of hygiene and quality in Nigeria. Every drop is carefully filtered and quality-tested to ensure a crisp, refreshing, and clean taste. Processed under strict zero-contact guidelines to guarantee safety.</p>
                </div>
                
                <div id="tab-delivery" class="tab-content">
                  <p>All items are packed and secured on the day of dispatch. Carried in temperature-regulated containers to preserve quality. Standard fulfillment resolves within 12–24 hours post purchase.</p>
                </div>
              </div>
            </div>
          </div>
        `;

        // Quantity Stepper Handlers
        const qtyMinus = document.getElementById('qty-minus');
        const qtyPlus = document.getElementById('qty-plus');
        const qtyVal = document.getElementById('qty-val');

        if (qtyMinus && qtyPlus && qtyVal) {
          const maxStock = Number(p.stock);
          
          const updateQtyBtns = () => {
            const current = parseInt(qtyVal.value) || 0;
            qtyMinus.disabled = (current <= 1 || maxStock <= 0);
            qtyPlus.disabled = (current >= maxStock || maxStock <= 0);
          };

          qtyMinus.onclick = () => {
            let current = parseInt(qtyVal.value) || 1;
            if (current > 1) {
              qtyVal.value = current - 1;
            }
            updateQtyBtns();
          };

          qtyPlus.onclick = () => {
            let current = parseInt(qtyVal.value) || 1;
            if (current < maxStock) {
              qtyVal.value = current + 1;
            }
            updateQtyBtns();
          };
          
          updateQtyBtns();
        }

        // Add to Cart Logic
        document.getElementById('addCart').onclick = async () => {
          const qty = parseInt(qtyVal.value) || 1;
          try {
            await api("cart.add", "POST", {product_id: Number(id), quantity: qty});
            toast(`Added ${qty} beverage(s) to your cart!`, "success");
            if (window.updateCartBadge) window.updateCartBadge();
          } catch(e) {
            toast("Please login to add items to your cart.", "warning");
          }
        };

        // Wishlist Toggle Logic
        const wishBtn = document.getElementById('addWish');
        const wishTxt = document.getElementById('wish-txt');
        
        wishBtn.onclick = async () => {
          try {
            if (wishBtn.classList.contains('active')) {
              toast("Product is already saved in your wishlist!");
              return;
            }
            await api("wishlist.add", "POST", {product_id: Number(id)});
            wishBtn.classList.add('active');
            wishTxt.textContent = "Saved";
            toast("Added to wishlist successfully!", "success");
          } catch(e) {
            toast("Please login to save to wishlist.", "warning");
          }
        };

        // Specifications Tabs Selector
        const tabButtons = document.querySelectorAll('.tab-btn');
        tabButtons.forEach(btn => {
          btn.onclick = () => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            btn.classList.add('active');
            const targetId = btn.getAttribute('data-tab');
            const targetContent = document.getElementById(targetId);
            if (targetContent) targetContent.classList.add('active');
          };
        });

        // Load similar products in category
        loadSimilar(p.category, p.id);

      } catch (err) {
        document.getElementById('view').innerHTML = `
          <div style="text-align: center; padding: 4rem 2rem; background:white; border-radius:var(--radius-lg); border:1px solid var(--border-color);">
            <i class="fa-solid fa-triangle-exclamation" style="font-size:3rem; color:#ef4444; margin-bottom:1rem;"></i>
            <p style="font-weight:700; color:var(--text-main); font-size:1.2rem;">Product Not Found</p>
            <p style="color:var(--text-muted); margin-bottom:1.5rem;">We couldn't retrieve the selected beverage item.</p>
            <a href="shop.html" class="btn btn-primary">Return to Catalog</a>
          </div>`;
      }
    }

    async function loadSimilar(category, currentId) {
      try {
        const all = await api(`products.list&category=${encodeURIComponent(category)}`);
        
        // Filter out current item
        let similar = all.filter(p => Number(p.id) !== Number(currentId));
        
        // Prefer older products or fallback to any
        const older = similar.filter(p => Number(p.id) < Number(currentId));
        if (older.length > 0) {
          similar = older;
        }

        // Limit to 4 items
        similar = similar.slice(0, 4);
        
        if (similar.length > 0) {
          const grid = document.getElementById('similar-grid');
          document.getElementById('similar-view').style.display = 'block';
          
          grid.innerHTML = similar.map(p => {
            const priceFmt = Number(p.price).toLocaleString('en-NG', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            return `
              <a href="product-details.html?id=${p.id}" class="similar-card">
                <img src="${getProductImageUrl(p.image_url)}" alt="${p.name}">
                <div class="similar-card-body">
                  <h3>${p.name}</h3>
                  <p class="similar-card-price">₦${priceFmt}</p>
                </div>
              </a>
            `;
          }).join('');
        }
      } catch (err) {
        console.error("Failed to load similar recommended products", err);
      }
    }

    load();
  </script>
</body>
</html>
